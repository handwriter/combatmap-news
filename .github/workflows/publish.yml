name: Publish game content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'admin/**'
      - 'site/**'
      - 'schema/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/publish.yml'
  schedule:
    # Daily rebuild drops items that ended more than a week ago.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: balance-publication
          path: |
            dist/v1/balance/publication.json
            dist/v1/balance/production-history.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  record-balance-publication:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: balance-publication
          path: .balance-publication
      - run: node scripts/record-balance-publication.mjs .balance-publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
