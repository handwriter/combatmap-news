# Sveltia CMS configuration (Decap-compatible format).
# Every save is a commit to main; the "Publish news" workflow validates and deploys it in ~1–2 minutes.

backend:
  name: github
  repo: handwriter/combatmap-news
  branch: main
  commit_messages:
    create: 'news: create {{slug}}'
    update: 'news: update {{slug}}'
    delete: 'news: delete {{slug}}'
    uploadMedia: 'media: upload {{path}}'
    deleteMedia: 'media: delete {{path}}'

site_url: https://handwriter.github.io/combatmap-news/
display_url: https://handwriter.github.io/combatmap-news/

media_folder: content/media
public_folder: /media

i18n:
  structure: single_file
  locales: [en, ru, tr, fr, ar]
  default_locale: en

collections:
  - name: maps
    label: Maps
    label_singular: Map
    description: >-
      Official map pool. Upload a JSON map saved by the game's editor. Saving publishes
      automatically; disable a map to temporarily remove it from the pool. Keep the entry
      filename unchanged when renaming or replacing a map: it is its permanent ID.
    folder: content/maps
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} · enabled: {{enabled}} · order: {{order}}'
    sortable_fields: [order, title, enabled]
    i18n: false
    fields:
      - { name: title, label: Name, widget: string, pattern: ['^.{1,80}$', 'Max 80 characters'] }
      - name: file
        label: Map JSON
        widget: file
        accept: .json
        choose_url: false
        media_folder: /content/map-files
        public_folder: /map-files
        hint: Upload a JSON file from the game. Replacing the file keeps this map's catalog ID.
      - { name: enabled, label: Enabled, widget: boolean, default: true }
      - name: order
        label: Order
        widget: number
        value_type: int
        min: 0
        default: 0
        hint: Lower values appear first; equal values are ordered by permanent ID.
  - name: news
    label: News
    label_singular: News item
    description: >-
      Cards in the game's main menu. Only "Title (en)" and "Published at" are required —
      empty image / text blocks are simply not shown, the whole card is the link. Saving publishes to players
      in about 1–2 minutes; use "Show from" to schedule an item.
    folder: content/news
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    identifier_field: title
    summary: '{{title}} · {{type}} · {{publishedAt | date("YYYY-MM-DD")}}'
    sortable_fields: [publishedAt, priority, title]
    i18n: true
    fields:
      - name: type
        label: Type
        widget: select
        default: news
        options:
          - { label: News, value: news }
          - { label: Event, value: event }
          - { label: Update, value: update }
      - name: priority
        label: Priority
        widget: number
        value_type: int
        min: 0
        max: 100
        default: 0
        hint: Higher is shown first; equal priority → newest first. The menu shows up to 10 items.
      - name: publishedAt
        label: Published at
        widget: datetime
        picker_utc: true
        default: '{{now}}'
      - name: startsAt
        label: Show from (optional)
        widget: datetime
        picker_utc: true
        required: false
        hint: Leave empty to show immediately. Times are UTC.
      - name: endsAt
        label: Show until (optional)
        widget: datetime
        picker_utc: true
        required: false
        hint: Leave empty to show until removed.
      - name: minGameVersion
        label: Min game version (optional)
        widget: string
        required: false
        pattern: ['^\d+(\.\d+)*$', 'Format: 0.107']
      - name: maxGameVersion
        label: Max game version (optional)
        widget: string
        required: false
        pattern: ['^\d+(\.\d+)*$', 'Format: 0.107']
      - name: image
        label: Image (optional)
        widget: image
        required: false
        hint: Any size; it is cropped to 16:9 and resized to 640×360 JPEG on publish.
      - name: title
        label: Title
        widget: string
        i18n: true
        required: [en]
        pattern: ['^.{1,80}$', 'Max 80 characters (2 lines on the card)']
      - name: text
        label: Text (optional)
        widget: text
        i18n: true
        required: false
        pattern: ['^[\s\S]{0,280}$', 'Max 280 characters (about 5 lines on the card)']
      - name: buttonUrl
        label: Link (optional)
        widget: string
        required: false
        hint: Any https:// link. The whole card opens it in the browser; without a link the card is not clickable.
        pattern: ['^https://', 'Must start with https://']
