<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Combat Map — Content preview</title>
    <style>
      :root { --bg: #ede8dc; --card: #d8d0be; --ink: #1a1208; --muted: #6b5a40; --line: #a09070;
              --green: #2e7d32; --brown: #8b4513; --frame: #8c7c60; --ph: #c0b7a5; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
               border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; }
      select, a.btn { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
                      background: var(--card); color: var(--ink); text-decoration: none; }
      .meta-line { color: var(--muted); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 440px)); gap: 12px; }
      .card { background: var(--card); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; border: 1px solid var(--frame); }
      .row { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
      .badge { color: #f0f7f0; font-size: 11px; font-weight: 600; letter-spacing: .8px; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
      .badge.event { background: var(--green); } .badge.update { background: var(--brown); } .badge.news { background: var(--muted); }
      .title { font-size: 17px; font-weight: 600; margin: 0; }
      .text { color: var(--muted); margin: 0; white-space: pre-line; }
      .card.link { cursor: pointer; } .card.link:hover { background: #b1bd9b; }
      .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 32px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Combat Map — news</h1>
        <div class="controls">
          <select id="lang" aria-label="Language">
            <option>en</option><option>ru</option><option>tr</option><option>fr</option><option>ar</option>
          </select>
          <a class="btn" href="admin/">Edit content →</a>
          <a class="btn" href="balance.html">Баланс игры →</a>
        </div>
      </header>
      <p class="meta-line" id="meta">Loading…</p>
      <div class="grid" id="cards"></div>
      <h1 style="margin:32px 0 16px">Official maps</h1>
      <p class="meta-line" id="maps-meta">Loading maps…</p>
      <div class="grid" id="maps"></div>
    </main>
    <script>
      const pick = (map, lang) => map && (map[lang] || map.en);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

      let renderToken = 0;
      async function render() {
        const token = ++renderToken;
        const feedPath = 'v1/news.json';
        const cards = document.getElementById('cards');
        const meta = document.getElementById('meta');
        let feed;
        try {
          feed = await (await fetch(feedPath, { cache: 'no-store' })).json();
        } catch {
          feed = null;
        }
        if (token !== renderToken) return; // a newer render started while this one was loading
        const lang = document.getElementById('lang').value;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        cards.replaceChildren();
        if (!feed) {
          meta.textContent = 'Feed not published yet';
          return;
        }
        meta.textContent = `${feed.items.length} item(s) · generated ${new Date(feed.generatedAt).toLocaleString()}`;
        if (feed.items.length === 0) { cards.append(el('div', 'empty', 'No news — the panel is hidden in the game.')); return; }
        const base = feedPath.slice(0, feedPath.lastIndexOf('/') + 1);
        for (const item of feed.items) {
          const card = el('article', `card`);
          if (item.image) { const img = el('img'); img.src = base + item.image.url; img.alt = ''; card.append(img); }
          const row = el('div', 'row');
          row.append(el('span', `badge ${item.type}`, item.type));
          const dates = [item.startsAt || item.publishedAt, item.endsAt].filter(Boolean).map((d) => new Date(d).toLocaleDateString());
          row.append(el('span', null, dates.join(' – ')));
          card.append(row, el('h2', 'title', pick(item.title, lang)));
          if (item.text) card.append(el('p', 'text', pick(item.text, lang)));
          if (item.url) {
            card.classList.add('link');
            card.title = item.url;
            card.addEventListener('click', () => window.open(item.url, '_blank', 'noopener'));
          }
          cards.append(card);
        }
      }
      document.getElementById('lang').addEventListener('change', render);
      render();

      async function renderMaps() {
        const list = document.getElementById('maps');
        const meta = document.getElementById('maps-meta');
        try {
          const response = await fetch('v1/maps.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Catalog unavailable');
          const feed = await response.json();
          if (feed.schemaVersion !== 1 || !Array.isArray(feed.items)) throw new Error('Unsupported catalog');
          meta.textContent = `${feed.items.length} map(s) · generated ${new Date(feed.generatedAt).toLocaleString()}`;
          if (!feed.items.length) list.append(el('div', 'empty', 'Official pool is empty. Personal maps remain available in the game.'));
          for (const map of feed.items) {
            const card = el('article', 'card');
            card.append(el('h2', 'title', map.name));
            card.append(el('p', 'text', `${map.maxPlayers} players · ${map.maxUnitsPerPlayer > 0 ? map.maxUnitsPerPlayer + ' units per player' : 'unlimited units'}`));
            const link = el('a', 'btn', 'Download JSON');
            link.href = 'v1/' + map.url;
            link.download = map.id + '.json';
            card.append(link);
            list.append(card);
          }
        } catch {
          meta.textContent = 'Map catalog unavailable';
        }
      }
      renderMaps();
    </script>
  </body>
</html>
